# vnf_mon — recolhe as sondas das VNFs pela rede de gestão (10.0.100.0/24).
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: vnfs
    static_configs:
      - targets: ['10.0.100.2:9101']
        labels: { funcao: controlo_acesso }
      - targets: ['10.0.100.3:9101']
        labels: { funcao: classificacao }
      - targets: ['10.0.100.4:9101']
        labels: { funcao: policiamento_agendamento }
